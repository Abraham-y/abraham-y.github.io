  /* ===== TITLE BAR ===== */
  .titlebar {

    justify-content: space-between; padding: 0 10px; flex-shrink: 0;

  .tb-left { display: flex; align-items: center; gap: 8px; }

  .claude-btn:hover { filter: brightness(1.1); }

  /* ===== BODY (activity | sidebar | main | claude) ===== */
  .body { display: flex; flex: 1; min-height: 0; }

    width: 48px; background: var(--activitybar); flex-shrink: 0;

  .act-icon:hover { color: var(--text); }
  .act-icon.active { color: var(--text-bright); border-left-color: var(--text-bright); }

  .md-preview ul { margin: 0.6em 0; padding-left: 1.4em; }
  .md-preview li { margin: 0.28em 0; }
  .md-preview a { color: #4ea1ff; }
  .md-preview a:hover { text-decoration: underline; }
  .md-preview strong { color: #fff; }
  .md-preview code { background: #ffffff14; padding: 1px 6px; border-radius: 3px; color: var(--s); font-size: 0.92em; }

  .cp-suggest { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 7px; flex-shrink: 0; }
  .chip { font-size: 11.5px; color: var(--text); background: #ffffff10; border: 1px solid #ffffff1f; border-radius: 14px;

  .chip:hover { background: #ffffff20; }
  .cp-input { display: flex; gap: 6px; padding: 10px 14px 14px; border-top: 1px solid var(--border); flex-shrink: 0; }

  }

  .sb-overlay { display: none; }

  @media (max-width: 760px) {
    .menu-btn { display: block; }

    .sb-group.collapsible { display: none; }
  }

/* ---- tiny Markdown renderer (source highlight + inline-figure preview) ---- */
function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// matches: ![alt](src) | [text](url) | **bold** | `code`
const INLINE_RE = /!\[([^\]]*)\]\(([^)]+)\)|\[([^\]]+)\]\(([^)]+)\)|\*\*([^*]+)\*\*|`([^`]+)`/g;

function inlineSource(s) {
  return s.replace(INLINE_RE, (m, ia, isrc, lt, lurl, b, code) => {
    if (ia !== undefined) return '<span class="pn">![</span><span class="s">' + ia + '</span><span class="pn">](</span><span class="v">' + isrc + '</span><span class="pn">)</span>';
    if (lt !== undefined) return '<span class="pn">[</span><span class="fn">' + lt + '</span><span class="pn">](</span><span class="v">' + lurl + '</span><span class="pn">)</span>';
    if (b !== undefined) return '<span class="pn">**</span><span class="md-b">' + b + '</span><span class="pn">**</span>';
    return '<span class="pn">\`</span><span class="md-code">' + code + '</span><span class="pn">\`</span>';
  });
}
function inlineHtml(s) {
  return s.replace(INLINE_RE, (m, ia, isrc, lt, lurl, b, code) => {
    if (ia !== undefined) return '<img src="' + isrc + '" alt="' + ia + '">';
    if (lt !== undefined) return '<a href="' + lurl + '" target="_blank">' + lt + '</a>';
    if (b !== undefined) return '<strong>' + b + '</strong>';
    return '<code>' + code + '</code>';
  });
}
function highlightMarkdown(md) {
  return md.split('\n').map(raw => {
    let inner, m;
    if (raw === '') inner = '&nbsp;';
    else if (m = raw.match(/^(#{1,6})\s+(.*)$/)) inner = '<span class="hash">' + m[1] + ' </span><span class="md-h">' + inlineSource(escapeHtml(m[2])) + '</span>';
    else if (m = raw.match(/^(\s*)([-*])\s+(.*)$/)) inner = m[1] + '<span class="md-li">' + m[2] + '</span> ' + inlineSource(escapeHtml(m[3]));
    else if (m = raw.match(/^>\s?(.*)$/)) inner = '<span class="md-q">&gt; ' + inlineSource(escapeHtml(m[1])) + '</span>';
    else inner = inlineSource(escapeHtml(raw));
    return '<div class="line"><span class="lc">' + inner + '</span></div>';
  }).join('');
}
function renderMarkdownPreview(md) {
  let html = '', para = [], list = [], quote = [];
  const flushP = () => { if (para.length) { html += '<p>' + inlineHtml(escapeHtml(para.join(' '))) + '</p>'; para = []; } };
  const flushL = () => { if (list.length) { html += '<ul>' + list.map(li => '<li>' + inlineHtml(escapeHtml(li)) + '</li>').join('') + '</ul>'; list = []; } };
  const flushQ = () => { if (quote.length) { html += '<blockquote>' + inlineHtml(escapeHtml(quote.join(' '))) + '</blockquote>'; quote = []; } };
  const flushAll = () => { flushP(); flushL(); flushQ(); };
  md.split('\n').forEach(raw => {
    let m;
    if (raw.trim() === '') { flushAll(); return; }
    if (m = raw.match(/^\s*!\[([^\]]*)\]\(([^)]+)\)\s*$/)) {
      flushAll();
      const alt = escapeHtml(m[1]), src = escapeHtml(m[2]);
      html += '<figure><img src="' + src + '" alt="' + alt + '">' + (alt ? '<figcaption>' + alt + '</figcaption>' : '') + '</figure>';
    } else if (m = raw.match(/^(#{1,6})\s+(.*)$/)) {
      flushAll(); const lvl = m[1].length;
      html += '<h' + lvl + '>' + inlineHtml(escapeHtml(m[2])) + '</h' + lvl + '>';
    } else if (m = raw.match(/^\s*[-*]\s+(.*)$/)) { flushP(); flushQ(); list.push(m[1]); }
    else if (m = raw.match(/^>\s?(.*)$/)) { flushP(); flushL(); quote.push(m[1]); }
    else { flushL(); flushQ(); para.push(raw); }
  });
  flushAll();
  return html;
}

  if (claudeInit) return; claudeInit = true;
  addMsg('bot', `Hi! 👋 I'm a quick assistant for <b>Abraham's</b> site. Ask me anything, or pick a question below.`);
  cpSuggest.innerHTML = SUGGESTIONS.map(s => `<span class="chip">${s}</span>`).join('');
  cpSuggest.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => ask(c.textContent)));
}
function toggleClaude(open) {
  const isOpen = open !== undefined ? open : !document.body.classList.contains('claude-open');
  document.body.classList.toggle('claude-open', isOpen);
  if (isOpen) { initClaude(); document.getElementById('cpInput').focus(); }
}
document.getElementById('claudeBtn').addEventListener('click', () => toggleClaude());
document.getElementById('cpClose').addEventListener('click', () => toggleClaude(false));
document.getElementById('cpForm').addEventListener('submit', e => {
  e.preventDefault();
  const inp = document.getElementById('cpInput');
  const v = inp.value.trim();
  if (!v) return;
  ask(v); inp.value = '';
});

/* ===== init ===== */
renderTabs();
renderEditor();
</script>
</body>
</html>
