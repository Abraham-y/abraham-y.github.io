  <polyline fill="none" stroke="#d97757" stroke-width="2.5" stroke-dasharray="6 5" points="80,300 200,290 320,275 440,255 560,235 680,210 760,195"/>
  <!-- labels -->
  <text x="410" y="365" text-anchor="middle" fill="#6b7280" font-size="15" font-weight="600">FIGURE PLACEHOLDER</text>
