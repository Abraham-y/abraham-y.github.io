  <!-- light grid -->
  <g stroke="#e6e9ee" stroke-width="1">
    <line x1="80" y1="40" x2="80" y2="320"/>
    <line x1="80" y1="320" x2="760" y2="320"/>
    <line x1="80" y1="250" x2="760" y2="250"/>
